spring:
  application:
    name: ai-studio-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aistudio}
    username: ${DB_USER:aistudio}
    password: ${DB_PASSWORD:aistudio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

aistudio:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-please-use-a-long-random-secret-key}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    hsts-enabled: ${HSTS_ENABLED:false}
  metrics:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  mail:
    provider: ${MAIL_PROVIDER:logging}
    from: ${MAIL_FROM:noreply@localhost}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:mock}
    provider-chain: ${AI_PROVIDER_CHAIN:}
    provider-fallbacks: ${AI_PROVIDER_FALLBACKS:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    context:
      max-requirements: 50
      max-tasks: 100
      max-messages: 20
      max-chars: 48000
    conversation:
      share-ttl-seconds: ${CONVERSATION_SHARE_TTL_SECONDS:604800}
    rate-limit:
      ai-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:30}
    embedding:
      provider: ${EMBEDDING_PROVIDER:mock}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: 384
    rag:
      enabled: ${RAG_ENABLED:true}
      top-k: ${RAG_TOP_K:8}
      max-chars: ${RAG_MAX_CHARS:6000}
  jobs:
    poll-interval-ms: ${JOB_POLL_INTERVAL_MS:2000}
    worker-enabled: ${AISTUDIO_JOBS_WORKER_ENABLED:true}
    worker-id: ${AISTUDIO_JOBS_WORKER_ID:}
    batch-size: ${JOB_BATCH_SIZE:5}
    stale-lock-seconds: ${JOB_STALE_LOCK_SECONDS:900}
    stale-reclaim-interval-ms: ${JOB_STALE_RECLAIM_INTERVAL_MS:60000}
    max-attempts: ${JOB_MAX_ATTEMPTS:3}
  billing:
    provider: ${BILLING_PROVIDER:mock}
    app-base-url: ${BILLING_APP_BASE_URL:http://localhost:5173}
    usage-sync-token: ${BILLING_USAGE_SYNC_TOKEN:}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      pro-price-id: ${STRIPE_PRO_PRICE_ID:}
      team-price-id: ${STRIPE_TEAM_PRICE_ID:}
      pro-seat-metered-price-id: ${STRIPE_PRO_SEAT_METERED_PRICE_ID:}
      team-seat-metered-price-id: ${STRIPE_TEAM_SEAT_METERED_PRICE_ID:}
      pro-ai-overage-metered-price-id: ${STRIPE_PRO_AI_OVERAGE_METERED_PRICE_ID:}
      team-ai-overage-metered-price-id: ${STRIPE_TEAM_AI_OVERAGE_METERED_PRICE_ID:}
  sso:
    enabled: ${SSO_ENABLED:true}
    provider: ${SSO_PROVIDER:mock}
    app-base-url: ${SSO_APP_BASE_URL:${BILLING_APP_BASE_URL:http://localhost:5173}}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      display-name: ${OIDC_DISPLAY_NAME:Continue with SSO}
      scopes: ${OIDC_SCOPES:openid email profile}
    saml:
      metadata-url: ${SAML_METADATA_URL:}
      entity-id: ${SAML_ENTITY_ID:}
      acs-url: ${SAML_ACS_URL:}
      display-name: ${SAML_DISPLAY_NAME:Continue with SAML}
      stub-mode: ${SAML_STUB_MODE:true}
      sp-private-key: ${SAML_SP_PRIVATE_KEY:}
      sp-certificate: ${SAML_SP_CERTIFICATE:}
      want-encrypted-assertions: ${SAML_WANT_ENCRYPTED_ASSERTIONS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aistudio: INFO
    org.springframework.security: INFO
