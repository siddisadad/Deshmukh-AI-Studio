name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aistudio
          POSTGRES_USER: aistudio
          POSTGRES_PASSWORD: aistudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistudio -d aistudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test
        env:
          # Prefer Testcontainers (Docker on the runner). Fallback values for agents without Docker.
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
      - name: Export OpenAPI spec
        run: |
          mvn -B -DskipTests package
          mvn -B spring-boot:start -Dspring-boot.run.arguments="--spring.profiles.active=dev"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            sleep 2
          done
          mkdir -p ../openapi
          curl -sf http://localhost:8080/v3/api-docs -o ../openapi/openapi.json
          mvn -B spring-boot:stop
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
          JWT_SECRET: ci-openapi-export-secret-key-at-least-32-bytes
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
