apiVersion: apps/v1
kind: Deployment
metadata:
  name: aistudio-worker
  labels:
    app: aistudio-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aistudio-worker
  template:
    metadata:
      labels:
        app: aistudio-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/siddisadad/deshmukh-ai-studio/api:v0.2.56-beta
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod,worker
            - name: AISTUDIO_JOBS_WORKER_ENABLED
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: aistudio-db
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aistudio-db
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aistudio-secrets
                  key: jwt-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
