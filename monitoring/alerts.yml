groups:
  - name: aistudio-api
    rules:
      - alert: ApiDown
        expr: up{job="aistudio-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: AI Studio API target is down
          description: Prometheus cannot scrape api:8080/actuator/prometheus.

      - alert: ApiHighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="aistudio-api",status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count{job="aistudio-api"}[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High 5xx rate on AI Studio API
          description: More than 5% of HTTP requests returned 5xx in the last 5 minutes.

      - alert: ApiHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_server_requests_seconds_bucket{job="aistudio-api"}[5m])) by (le)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High API latency (p95)
          description: 95th percentile request latency exceeded 2s for 10 minutes.
