spring:
  application:
    name: ai-studio-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aistudio}
    username: ${DB_USER:aistudio}
    password: ${DB_PASSWORD:aistudio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

aistudio:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-please-use-a-long-random-secret-key}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    hsts-enabled: ${HSTS_ENABLED:false}
  metrics:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  slo:
    target-metrics-refresh-ms: ${SLO_TARGET_METRICS_REFRESH_MS:60000}
  mail:
    provider: ${MAIL_PROVIDER:logging}
    from: ${MAIL_FROM:noreply@localhost}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    provider: ${AI_PROVIDER:mock}
    provider-chain: ${AI_PROVIDER_CHAIN:}
    provider-fallbacks: ${AI_PROVIDER_FALLBACKS:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    context:
      max-requirements: 50
      max-tasks: 100
      max-messages: 20
      max-chars: 48000
    conversation:
      share-ttl-seconds: ${CONVERSATION_SHARE_TTL_SECONDS:604800}
      export-redaction-policy: ${CHAT_EXPORT_REDACTION_POLICY:none}
      compliance-export-redaction-policy: ${CHAT_EXPORT_COMPLIANCE_REDACTION_POLICY:none}
      export-watermark-enabled: ${CHAT_EXPORT_WATERMARK_ENABLED:false}
      export-watermark-notice: ${CHAT_EXPORT_WATERMARK_NOTICE:Confidential — AI Studio export. Do not redistribute.}
      export-dlp-enabled: ${CHAT_EXPORT_DLP_ENABLED:false}
      export-dlp-block-on-match: ${CHAT_EXPORT_DLP_BLOCK_ON_MATCH:true}
      export-dlp-webhook-url: ${CHAT_EXPORT_DLP_WEBHOOK_URL:}
  exports:
    siem-export-enabled: ${EXPORT_SIEM_EXPORT_ENABLED:false}
    siem-export-interval-ms: ${EXPORT_SIEM_EXPORT_INTERVAL_MS:300000}
  ops:
    release-gate-max-age-hours: ${RELEASE_GATE_MAX_AGE_HOURS:48}
    rate-limit:
      ai-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:30}
    embedding:
      provider: ${EMBEDDING_PROVIDER:mock}
      model: ${EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: 384
    rag:
      enabled: ${RAG_ENABLED:true}
      top-k: ${RAG_TOP_K:8}
      max-chars: ${RAG_MAX_CHARS:6000}
    circuit-breaker:
      enabled: ${AI_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
      open-seconds: ${AI_CIRCUIT_BREAKER_OPEN_SECONDS:60}
    adaptive-routing:
      enabled: ${AI_ADAPTIVE_ROUTING_ENABLED:false}
      sample-size: ${AI_ADAPTIVE_ROUTING_SAMPLE_SIZE:50}
    cost-aware-routing:
      enabled: ${AI_COST_AWARE_ROUTING_ENABLED:false}
    provider-quotas: ${AI_PROVIDER_QUOTAS:}
    provider-cost-tiers: ${AI_PROVIDER_COST_TIERS:}
    assistant-model-map: ${AI_ASSISTANT_MODEL_MAP:}
    prompt-cache:
      enabled: ${AI_PROMPT_CACHE_ENABLED:false}
      ttl-seconds: ${AI_PROMPT_CACHE_TTL_SECONDS:300}
      max-entries: ${AI_PROMPT_CACHE_MAX_ENTRIES:500}
      native-enabled: ${AI_PROVIDER_NATIVE_PROMPT_CACHE_ENABLED:false}
    policy-change-approval-enabled: ${AI_POLICY_CHANGE_APPROVAL_ENABLED:false}
    policy-simulation-gate-enabled: ${AI_POLICY_SIMULATION_GATE_ENABLED:false}
    policy-simulation-gate-ttl-minutes: ${AI_POLICY_SIMULATION_GATE_TTL_MINUTES:30}
    canary-hook-eval-enabled: ${AI_CANARY_HOOK_EVAL_ENABLED:false}
    canary-hook-eval-interval-ms: ${AI_CANARY_HOOK_EVAL_INTERVAL_MS:300000}
    cross-region-routing:
      enabled: ${AI_CROSS_REGION_ROUTING_ENABLED:false}
      deploy-region: ${AISTUDIO_DEPLOY_REGION:}
      endpoint-map: ${AI_PROVIDER_ENDPOINT_MAP:}
      region-chains: ${AI_PROVIDER_REGION_CHAINS:}
  jobs:
    poll-interval-ms: ${JOB_POLL_INTERVAL_MS:2000}
    worker-enabled: ${AISTUDIO_JOBS_WORKER_ENABLED:true}
    worker-id: ${AISTUDIO_JOBS_WORKER_ID:}
    batch-size: ${JOB_BATCH_SIZE:5}
    stale-lock-seconds: ${JOB_STALE_LOCK_SECONDS:900}
    stale-reclaim-interval-ms: ${JOB_STALE_RECLAIM_INTERVAL_MS:60000}
    max-attempts: ${JOB_MAX_ATTEMPTS:3}
    autoscale:
      target-pending-per-replica: ${WORKER_TARGET_PENDING_PER_REPLICA:10}
      max-replicas: ${WORKER_REPLICAS_MAX:6}
  billing:
    provider: ${BILLING_PROVIDER:mock}
    app-base-url: ${BILLING_APP_BASE_URL:http://localhost:5173}
    usage-sync-token: ${BILLING_USAGE_SYNC_TOKEN:}
    dunning-enabled: ${BILLING_DUNNING_ENABLED:false}
    dunning-interval-hours: ${BILLING_DUNNING_INTERVAL_HOURS:72}
    dunning-max-stage: ${BILLING_DUNNING_MAX_STAGE:3}
    dunning-scheduler-interval-ms: ${BILLING_DUNNING_SCHEDULER_INTERVAL_MS:259200000}
    reconciliation-enabled: ${BILLING_RECONCILIATION_ENABLED:false}
    reconciliation-tolerance-cents: ${BILLING_RECONCILIATION_TOLERANCE_CENTS:500}
    reconciliation-metrics-refresh-ms: ${BILLING_RECONCILIATION_METRICS_REFRESH_MS:300000}
    stripe:
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      pro-price-id: ${STRIPE_PRO_PRICE_ID:}
      team-price-id: ${STRIPE_TEAM_PRICE_ID:}
      pro-seat-metered-price-id: ${STRIPE_PRO_SEAT_METERED_PRICE_ID:}
      team-seat-metered-price-id: ${STRIPE_TEAM_SEAT_METERED_PRICE_ID:}
      pro-ai-overage-metered-price-id: ${STRIPE_PRO_AI_OVERAGE_METERED_PRICE_ID:}
      team-ai-overage-metered-price-id: ${STRIPE_TEAM_AI_OVERAGE_METERED_PRICE_ID:}
  sso:
    enabled: ${SSO_ENABLED:true}
    provider: ${SSO_PROVIDER:mock}
    app-base-url: ${SSO_APP_BASE_URL:${BILLING_APP_BASE_URL:http://localhost:5173}}
    metadata-refresh-enabled: ${SSO_METADATA_REFRESH_ENABLED:false}
    metadata-refresh-interval-ms: ${SSO_METADATA_REFRESH_INTERVAL_MS:3600000}
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:}
      client-id: ${OIDC_CLIENT_ID:}
      client-secret: ${OIDC_CLIENT_SECRET:}
      display-name: ${OIDC_DISPLAY_NAME:Continue with SSO}
      scopes: ${OIDC_SCOPES:openid email profile}
    saml:
      metadata-url: ${SAML_METADATA_URL:}
      entity-id: ${SAML_ENTITY_ID:}
      acs-url: ${SAML_ACS_URL:}
      display-name: ${SAML_DISPLAY_NAME:Continue with SAML}
      stub-mode: ${SAML_STUB_MODE:true}
      sp-private-key: ${SAML_SP_PRIVATE_KEY:}
      sp-certificate: ${SAML_SP_CERTIFICATE:}
      want-encrypted-assertions: ${SAML_WANT_ENCRYPTED_ASSERTIONS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aistudio: INFO
    org.springframework.security: INFO
