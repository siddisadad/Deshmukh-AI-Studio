name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aistudio
          POSTGRES_USER: aistudio
          POSTGRES_PASSWORD: aistudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistudio -d aistudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test
        env:
          # Prefer Testcontainers (Docker on the runner). Fallback values for agents without Docker.
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
      - name: Export OpenAPI spec
        run: |
          mvn -B -DskipTests package
          mvn -B spring-boot:start -Dspring-boot.run.arguments="--spring.profiles.active=dev"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            sleep 2
          done
          mkdir -p ../openapi
          curl -sf http://localhost:8080/v3/api-docs -o ../openapi/openapi.json
          mvn -B spring-boot:stop
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
          JWT_SECRET: ci-openapi-export-secret-key-at-least-32-bytes
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start compose stack (mock AI)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8088/actuator/health >/dev/null \
              && curl -sf http://localhost:8088/ >/dev/null; then
              echo "Stack ready"
              exit 0
            fi
            sleep 5
          done
          echo "Compose stack failed to become ready" >&2
          docker compose logs --no-color || true
          exit 1
        env:
          AI_PROVIDER: mock
          JWT_SECRET: ci-e2e-secret-key-at-least-32-bytes-long
          BILLING_APP_BASE_URL: http://localhost:8088
          SSO_APP_BASE_URL: http://localhost:8088
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke E2E
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:8088
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
      - name: Tear down compose
        if: always()
        run: docker compose down -v

  deploy-dry-run:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prod compose dry-run
        run: ./scripts/deploy-dry-run.sh
        env:
          AI_PROVIDER: mock
          JWT_SECRET: ci-deploy-dry-run-secret-key-at-least-32-bytes
          CORS_ORIGINS: https://dry-run.aistudio.test
          DRY_RUN_UI_PORT: "8090"

  staging-dry-run:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Staging compose dry-run
        run: ./scripts/staging-dry-run.sh
        env:
          AI_PROVIDER: mock
          JWT_SECRET: ci-staging-dry-run-secret-key-at-least-32-bytes
          CORS_ORIGINS: https://staging-dry-run.aistudio.test
          STAGING_UI_PORT: "8091"
          STAGING_API_PORT: "8092"

  environment-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Cloud Agent environment files
        run: python3 scripts/validate-environment-json.py
      - name: Validate staging env script (mock providers)
        run: |
          export JWT_SECRET=test-secret-key-at-least-32-bytes-long
          export DB_PASSWORD=test
          export CORS_ORIGINS=https://example.com
          bash scripts/validate-staging-env.sh
      - name: Reject localhost CORS for prod-shaped deploy
        run: |
          export JWT_SECRET=test-secret-key-at-least-32-bytes-long
          export DB_PASSWORD=test
          export CORS_ORIGINS=http://localhost:8088
          if bash scripts/validate-staging-env.sh; then
            echo "expected validation failure for localhost CORS" >&2
            exit 1
          fi
      - name: Validate workspace health
        run: ./scripts/validate-workspace.sh
      - name: Validate monitoring helper scripts
        run: |
          python3 -c "import yaml; yaml.safe_load(open('monitoring/loki-alerts.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/loki-config.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/loki-config-s3.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/grafana/provisioning/datasources/loki-regions.yml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/grafana/provisioning/datasources/prometheus-regions.yml'))"
          bash -n scripts/write-grafana-prometheus-regions.sh
          bash -n scripts/write-grafana-federated-dashboard.sh
          bash -n scripts/write-grafana-billing-dashboard.sh
          bash -n scripts/sync-loki-ruler-regions.sh
          bash -n scripts/write-alertmanager-config.sh
          bash -n scripts/sync-alertmanager-regions.sh
          ./scripts/write-alertmanager-config.sh
          python3 -c "import yaml; yaml.safe_load(open('monitoring/alertmanager.generated.yml'))"
          LOKI_QUERY_REGIONS=ci=http://127.0.0.1:3100 ./scripts/write-grafana-federated-dashboard.sh
          python3 -c "import json; json.load(open('monitoring/grafana/dashboards/aistudio-federated.json'))"
          bash -n scripts/export-loki-logs.sh
          bash -n scripts/query-loki-multi-region.sh
          bash -n scripts/write-grafana-loki-regions.sh
          bash -n scripts/worker-scale-hint.sh
          bash -n scripts/staging-dogfood.sh
          bash -n scripts/staging-signoff.sh
          bash -n scripts/sync-stripe-metered-prices.sh
          bash -n scripts/scheduled-stripe-usage-sync.sh
          bash -n scripts/staging-provider-probes.sh
          bash -n scripts/scheduled-chat-retention.sh
          bash -n scripts/write-prometheus-token.sh
          bash -n scripts/api-smoke.sh
          if ./scripts/write-prometheus-token.sh; then
            echo "expected failure without METRICS_SCRAPE_TOKEN" >&2
            exit 1
          fi
          export METRICS_SCRAPE_TOKEN=test-scrape-token-for-ci
          ./scripts/write-prometheus-token.sh
          ./scripts/write-grafana-loki-regions.sh
          test -f monitoring/grafana/provisioning/datasources/loki-regions.yml
