# Staging overlay — pull prebuilt GHCR images (no local build).
#
#   export IMAGE_TAG=main   # or sha-..., 0.1.0-beta, v0.1.0-beta
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Requires images published by .github/workflows/publish.yml

services:
  postgres:
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/siddisadad/deshmukh-ai-studio/api:${IMAGE_TAG:-main}}
    build: !reset
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for staging}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required for staging}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required for staging}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-30}
      BILLING_APP_BASE_URL: ${BILLING_APP_BASE_URL:-http://localhost:8088}
      SSO_APP_BASE_URL: ${SSO_APP_BASE_URL:-http://localhost:8088}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
      STRIPE_PRO_SEAT_METERED_PRICE_ID: ${STRIPE_PRO_SEAT_METERED_PRICE_ID:-}
      STRIPE_TEAM_SEAT_METERED_PRICE_ID: ${STRIPE_TEAM_SEAT_METERED_PRICE_ID:-}
      STRIPE_PRO_AI_OVERAGE_METERED_PRICE_ID: ${STRIPE_PRO_AI_OVERAGE_METERED_PRICE_ID:-}
      STRIPE_TEAM_AI_OVERAGE_METERED_PRICE_ID: ${STRIPE_TEAM_AI_OVERAGE_METERED_PRICE_ID:-}
      BILLING_USAGE_SYNC_TOKEN: ${BILLING_USAGE_SYNC_TOKEN:-}
      SSO_ENABLED: ${SSO_ENABLED:-true}
      SSO_PROVIDER: ${SSO_PROVIDER:-mock}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Continue with SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      SAML_STUB_MODE: ${SAML_STUB_MODE:-true}
      SAML_METADATA_URL: ${SAML_METADATA_URL:-}
      SAML_ENTITY_ID: ${SAML_ENTITY_ID:-}
      SAML_ACS_URL: ${SAML_ACS_URL:-}
      SAML_DISPLAY_NAME: ${SAML_DISPLAY_NAME:-Continue with SAML}
      SAML_SP_PRIVATE_KEY: ${SAML_SP_PRIVATE_KEY:-}
      SAML_SP_CERTIFICATE: ${SAML_SP_CERTIFICATE:-}
      SAML_WANT_ENCRYPTED_ASSERTIONS: ${SAML_WANT_ENCRYPTED_ASSERTIONS:-false}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-logging}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
    ports:
      - "${STAGING_API_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/siddisadad/deshmukh-ai-studio/frontend:${IMAGE_TAG:-main}}
    build: !reset
    pull_policy: always
    ports: !override
      - "${STAGING_UI_PORT:-8088}:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
