spring:
  config:
    activate:
      on-profile: prod

management:
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aistudio:
  security:
    hsts-enabled: true

# Console JSON formatting is configured in logback-spring.xml (prod profile).
logging:
  level:
    root: INFO
    com.aistudio: INFO
    org.springframework.security: WARN
