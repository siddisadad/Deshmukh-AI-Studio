# Activated when aistudio.mail.provider=smtp (see spring.config.activate below).
spring:
  config:
    activate:
      on-property:
        name: aistudio.mail.provider
        having-value: smtp
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${MAIL_USER:}}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

management:
  health:
    mail:
      enabled: true
