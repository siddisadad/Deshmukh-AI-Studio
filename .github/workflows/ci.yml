name: CI

on:
  push:
    branches: [main, cursor/**]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aistudio
          POSTGRES_USER: aistudio
          POSTGRES_PASSWORD: aistudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aistudio -d aistudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: mvn -B test
        env:
          # Prefer Testcontainers (Docker on the runner). Fallback values for agents without Docker.
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
      - name: Export OpenAPI spec
        run: |
          mvn -B -DskipTests package
          mvn -B spring-boot:start -Dspring-boot.run.arguments="--spring.profiles.active=dev"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            sleep 2
          done
          mkdir -p ../openapi
          curl -sf http://localhost:8080/v3/api-docs -o ../openapi/openapi.json
          mvn -B spring-boot:stop
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: aistudio
          DB_USER: aistudio
          DB_PASSWORD: aistudio
          JWT_SECRET: ci-openapi-export-secret-key-at-least-32-bytes
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Start compose stack (mock AI)
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8088/actuator/health >/dev/null \
              && curl -sf http://localhost:8088/ >/dev/null; then
              echo "Stack ready"
              exit 0
            fi
            sleep 5
          done
          echo "Compose stack failed to become ready" >&2
          docker compose logs --no-color || true
          exit 1
        env:
          AI_PROVIDER: mock
          JWT_SECRET: ci-e2e-secret-key-at-least-32-bytes-long
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Smoke E2E
        working-directory: e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:8088
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
      - name: Tear down compose
        if: always()
        run: docker compose down -v

  deploy-dry-run:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prod compose dry-run
        run: ./scripts/deploy-dry-run.sh
        env:
          AI_PROVIDER: mock
          JWT_SECRET: ci-deploy-dry-run-secret-key-at-least-32-bytes
          CORS_ORIGINS: https://dry-run.aistudio.test
          DRY_RUN_UI_PORT: "8090"
