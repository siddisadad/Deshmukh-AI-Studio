global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ${PROMETHEUS_CLUSTER_NAME:-local}

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/billing-alerts.yml
  - /etc/prometheus/slo-recording-rules.yml
  - /etc/prometheus/slo-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: aistudio-api
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ['api:8080']
    bearer_token_file: /etc/prometheus/token
