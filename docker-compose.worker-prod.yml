# Prod/staging secret env for worker (use with docker-compose.worker.yml + prod or staging).
services:
  worker:
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      BILLING_APP_BASE_URL: ${BILLING_APP_BASE_URL:-}
      SSO_APP_BASE_URL: ${SSO_APP_BASE_URL:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
      SSO_ENABLED: ${SSO_ENABLED:-true}
      SSO_PROVIDER: ${SSO_PROVIDER:-mock}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-logging}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    restart: unless-stopped
