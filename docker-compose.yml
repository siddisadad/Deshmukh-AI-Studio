services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-aistudio}
      POSTGRES_USER: ${DB_USER:-aistudio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aistudio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aistudio} -d ${DB_NAME:-aistudio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aistudio}
      DB_USER: ${DB_USER:-aistudio}
      DB_PASSWORD: ${DB_PASSWORD:-aistudio}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-use-a-long-random-secret-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8088}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8088:80"
    depends_on:
      - api

volumes:
  pgdata:
